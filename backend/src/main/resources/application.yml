# All environment-specific values come from environment variables (constitution Principle III).
# Required variables without defaults (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET) make
# startup fail fast when missing.
spring:
  application:
    name: tms-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT8H}
  cookie:
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  seed:
    users-enabled: ${APP_SEED_USERS_ENABLED:false}
    users: ${APP_SEED_USERS:}
    password: ${APP_SEED_USER_PASSWORD:}
