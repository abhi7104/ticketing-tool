name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker for real PostgreSQL 16.
      - name: Format check, unit + integration + state-machine + contract tests
        run: ./mvnw -B spotless:check verify
      - name: Dependency vulnerability scan
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: ${{ github.event_name == 'pull_request' }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the contract
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI-only environment (random values, never committed)
        run: |
          cp .env.example .env
          DBPW=$(openssl rand -hex 16); USERPW=$(openssl rand -hex 12)
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$DBPW|; s|^DB_PASSWORD=.*|DB_PASSWORD=$DBPW|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^APP_SEED_USER_PASSWORD=.*|APP_SEED_USER_PASSWORD=$USERPW|; s|^E2E_PASSWORD=.*|E2E_PASSWORD=$USERPW|" .env
          echo "E2E_PASSWORD=$USERPW" >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          E2E_USER: alice
          E2E_USER2: bob
        run: npm run test:e2e
      - name: Restart the stack and verify data survives
        run: docker compose restart backend frontend && docker compose up -d --wait
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
